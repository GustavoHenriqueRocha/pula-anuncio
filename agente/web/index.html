<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg">
<title>Pula Anúncio</title>
<style>
  :root {
    --fundo: #111; --cartao: #1c1c1e; --texto: #f2f2f2; --sutil: #9a9aa0;
    --borda: #2c2c2e; --verde: #2fbf71; --vermelho: #ff453a; --amarelo: #ffd60a; --azul: #0a84ff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { touch-action: manipulation; overscroll-behavior: none; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 16px max(12px, env(safe-area-inset-bottom));
    min-height: 100dvh; display: flex; flex-direction: column; gap: 10px;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  button { touch-action: manipulation; }
  .topo { display: flex; align-items: center; gap: 8px; }
  .maquinas { display: flex; gap: 8px; overflow-x: auto; flex: 1; }
  .chip {
    flex: none; border: 1px solid var(--borda); background: var(--cartao); color: var(--texto);
    border-radius: 999px; padding: 8px 12px; font: inherit; font-size: 14px; display: flex; align-items: center; gap: 8px;
  }
  .chip.ativa { border-color: var(--verde); }
  .bolinha { width: 9px; height: 9px; border-radius: 50%; background: var(--sutil); }
  .bolinha.on { background: var(--verde); }
  .bolinha.off { background: var(--vermelho); }
  .bolinha.ad { background: var(--amarelo); }
  .status { color: var(--sutil); font-size: 13px; text-align: center; min-height: 1.4em; }

  #pad {
    flex: 1; min-height: 42dvh; border-radius: 20px; background: var(--cartao); border: 1px solid var(--borda);
    touch-action: none; position: relative; display: grid; place-items: center; color: #3a3a3c; font-size: 14px;
  }
  #pad.tocando { border-color: #48484a; }
  .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mb {
    height: 64px; border-radius: 16px; border: 1px solid var(--borda); background: var(--cartao);
    color: var(--texto); font: inherit; font-weight: 600; position: relative; overflow: hidden; touch-action: none;
  }
  .mb.apertado { background: #2c2c2e; }
  .mb.travado { background: var(--azul); border-color: var(--azul); color: #fff; }
  .mb .carga { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: var(--azul); }
  .mb.carregando .carga { width: 100%; transition: width 2s linear; }

  .teclado { display: flex; flex-direction: column; gap: 8px; }
  #texto {
    width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--borda);
    background: #000; color: var(--texto); -webkit-user-select: text; user-select: text;
  }
  .teclas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tk {
    height: 46px; border-radius: 12px; border: 1px solid var(--borda); background: var(--cartao);
    color: var(--texto); font: inherit; font-size: 15px;
  }
  .tk:active, .mb:active { filter: brightness(1.3); }

  details { background: var(--cartao); border-radius: 16px; padding: 12px 16px; }
  summary { cursor: pointer; color: var(--sutil); }
  form { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; margin-top: 12px; }
  form input, .btn {
    font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--borda);
    background: #000; color: var(--texto); min-width: 0; -webkit-user-select: text; user-select: text;
  }
  .btn { background: var(--verde); color: #04140b; border: none; font-weight: 700; }
  ul { list-style: none; padding: 0; margin: 12px 0 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--borda); }
  li small { color: var(--sutil); }
  .remover { background: none; border: none; color: var(--vermelho); font: inherit; padding: 6px; }
</style>
</head>
<body>
  <div class="topo"><div class="maquinas" id="maquinas"></div></div>
  <div class="status" id="status">Cadastre uma máquina abaixo.</div>

  <div id="pad">1 dedo move · toque clica · 2 dedos rolam / toque = direito</div>
  <div class="botoes">
    <button class="mb" data-b="left">Esquerdo<span class="carga"></span></button>
    <button class="mb" data-b="right">Direito<span class="carga"></span></button>
  </div>

  <div class="teclado">
    <input id="texto" placeholder="Toque aqui para digitar no PC" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="send">
    <div class="teclas">
      <button class="tk" data-k="Escape">Esc</button>
      <button class="tk" data-k="Tab">Tab</button>
      <button class="tk" data-k="ArrowUp">↑</button>
      <button class="tk" data-k="Backspace">⌫</button>
      <button class="tk" data-k="Enter">⏎</button>
      <button class="tk" data-k="F11">Tela</button>
      <button class="tk" data-k="ArrowLeft">←</button>
      <button class="tk" data-k="ArrowDown">↓</button>
      <button class="tk" data-k="ArrowRight">→</button>
      <button class="tk" data-k="PlayPause">⏯</button>
      <button class="tk" data-k="VolumeMute">🔇</button>
      <button class="tk" data-k="VolumeDown">🔉</button>
      <button class="tk" data-k="VolumeUp">🔊</button>
      <button class="tk" data-k="Home">Início</button>
      <button class="tk" data-k="End">Fim</button>
    </div>
  </div>

  <details id="config">
    <summary>Máquinas cadastradas</summary>
    <form id="form">
      <input id="nome" placeholder="Nome (ex.: Sala)" required>
      <input id="ip" placeholder="IP (ex.: 192.168.3.53)" inputmode="decimal" required>
      <button class="btn">+</button>
    </form>
    <ul id="lista"></ul>
  </details>

<script>
const PORTA_PADRAO = 8765;
const SEGURAR_PARA_TRAVAR = 2000; // ms
const $ = (id) => document.getElementById(id);

// ---------- máquinas ----------
function carregar() {
  try { return JSON.parse(localStorage.getItem("maquinas")) || []; } catch { return []; }
}
function salvar() {
  try {
    localStorage.setItem("maquinas", JSON.stringify(maquinas));
    localStorage.setItem("ativa", ativa);
  } catch {}
}

let maquinas = carregar();
let ativa = 0;
try { ativa = Number(localStorage.getItem("ativa") || 0); } catch {}
const estado = {}; // ip -> "on" | "off" | "ad"

// Na primeira vez, já cadastra a máquina que serviu esta página
if (!maquinas.length && location.hostname) {
  maquinas.push({ nome: "Esta máquina", ip: location.host });
  salvar();
}

function host(m) { return m.ip.includes(":") ? m.ip : `${m.ip}:${PORTA_PADRAO}`; }

function desenhar() {
  if (ativa >= maquinas.length) ativa = 0;
  $("maquinas").innerHTML = "";
  maquinas.forEach((m, i) => {
    const b = document.createElement("button");
    b.className = "chip" + (i === ativa ? " ativa" : "");
    b.innerHTML = `<span class="bolinha ${estado[m.ip] || ""}"></span>`;
    b.append(m.nome);
    b.onclick = () => trocar(i);
    $("maquinas").append(b);
  });

  $("lista").innerHTML = "";
  maquinas.forEach((m, i) => {
    const li = document.createElement("li");
    li.innerHTML = `<span></span><button class="remover">remover</button>`;
    li.firstChild.append(m.nome, " ");
    const sm = document.createElement("small"); sm.textContent = m.ip; li.firstChild.append(sm);
    li.lastChild.onclick = () => { maquinas.splice(i, 1); salvar(); trocar(0); };
    $("lista").append(li);
  });
  if (!maquinas.length) $("config").open = true;
}

function trocar(i) {
  soltarTravados();
  ativa = i; salvar(); desenhar(); conectar(); atualizar();
}

async function pedir(m, caminho, opcoes = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 4000);
  try {
    const r = await fetch(`http://${host(m)}${caminho}`, { ...opcoes, signal: ctrl.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

async function atualizar() {
  const m = maquinas[ativa];
  if (!m) { $("status").textContent = "Cadastre uma máquina abaixo."; return; }
  try {
    const s = await pedir(m, "/status");
    estado[m.ip] = s.anuncio ? "ad" : "on";
    const conexao = ws?.readyState === WebSocket.OPEN ? "" : " · conectando controle…";
    $("status").textContent = (s.anuncio ? "Anúncio na tela" : s.maquina) + conexao;
  } catch {
    estado[m.ip] = "off";
    $("status").textContent = `${m.nome} não responde (${m.ip})`;
  }
  desenhar();
}

$("form").onsubmit = (e) => {
  e.preventDefault();
  maquinas.push({ nome: $("nome").value.trim(), ip: $("ip").value.trim() });
  $("form").reset();
  trocar(maquinas.length - 1);
};

// ---------- conexão de controle ----------
let ws = null;
let wsDe = null;
function conectar() {
  const m = maquinas[ativa];
  if (ws && wsDe === m?.ip && ws.readyState <= WebSocket.OPEN) return;
  try { ws?.close(); } catch {}
  ws = null; wsDe = m?.ip;
  if (!m) return;
  ws = new WebSocket(`ws://${host(m)}/controle`);
  ws.onclose = () => setTimeout(() => { if (wsDe === m.ip) { ws = null; conectar(); } }, 1500);
}
function enviar(obj) {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

// ---------- touchpad ----------
const pad = $("pad");
let toques = new Map();     // id -> {x, y}
let inicio = 0, maxDedos = 0, mexeu = false;
let acumX = 0, acumY = 0, rolX = 0, rolY = 0, agendado = false;

function descarregar() {
  agendado = false;
  if (acumX || acumY) { enviar({ t: "m", dx: +acumX.toFixed(2), dy: +acumY.toFixed(2) }); acumX = acumY = 0; }
  if (rolX || rolY) { enviar({ t: "s", dx: +rolX.toFixed(2), dy: +rolY.toFixed(2) }); rolX = rolY = 0; }
}
function agendar() { if (!agendado) { agendado = true; requestAnimationFrame(descarregar); } }

// Aceleração: movimento lento é preciso, rápido atravessa a tela
function acelerar(d) {
  const v = Math.abs(d);
  return d * Math.min(1.3 + v * 0.12, 4);
}

pad.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (!toques.size) { inicio = performance.now(); maxDedos = 0; mexeu = false; }
  for (const t of e.changedTouches) toques.set(t.identifier, { x: t.clientX, y: t.clientY, x0: t.clientX, y0: t.clientY });
  maxDedos = Math.max(maxDedos, toques.size);
  pad.classList.add("tocando");
}, { passive: false });

pad.addEventListener("touchmove", (e) => {
  e.preventDefault();
  let somaX = 0, somaY = 0, n = 0;
  for (const t of e.changedTouches) {
    const p = toques.get(t.identifier);
    if (!p) continue;
    somaX += t.clientX - p.x; somaY += t.clientY - p.y; n++;
    p.x = t.clientX; p.y = t.clientY;
    if (Math.hypot(p.x - p.x0, p.y - p.y0) > 8) mexeu = true;
  }
  if (!n) return;
  if (toques.size === 1) {
    acumX += acelerar(somaX); acumY += acelerar(somaY);
  } else {
    rolX += (somaX / n) * 1.5; rolY += (somaY / n) * 1.5;
  }
  agendar();
}, { passive: false });

function fimToque(e) {
  e.preventDefault();
  for (const t of e.changedTouches) toques.delete(t.identifier);
  if (toques.size) return;
  pad.classList.remove("tocando");
  if (!mexeu && performance.now() - inicio < 250) {
    tocarBotao(maxDedos >= 2 ? "right" : "left");
  }
}
pad.addEventListener("touchend", fimToque, { passive: false });
pad.addEventListener("touchcancel", fimToque, { passive: false });

// ---------- botões Esquerdo / Direito (segurar 2 s trava) ----------
const travado = { left: false, right: false };
const elBotao = (b) => document.querySelector(`.mb[data-b="${b}"]`);

function tocarBotao(b) {
  // Toque no pad com o botão travado só destrava
  if (travado[b]) return destravar(b);
  enviar({ t: "c", b });
}
function destravar(b) {
  travado[b] = false;
  elBotao(b).classList.remove("travado");
  enviar({ t: "b", b, down: false });
}
function soltarTravados() {
  for (const b of ["left", "right"]) if (travado[b]) destravar(b);
}

document.querySelectorAll(".mb").forEach((el) => {
  const b = el.dataset.b;
  let timer = null, eraTravado = false;

  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    el.setPointerCapture?.(e.pointerId);
    eraTravado = travado[b];
    if (eraTravado) return; // o toque vai destravar ao soltar
    enviar({ t: "b", b, down: true });
    el.classList.add("apertado", "carregando");
    timer = setTimeout(() => {
      timer = null;
      travado[b] = true;
      el.classList.remove("carregando");
      el.classList.add("travado");
      navigator.vibrate?.(40);
    }, SEGURAR_PARA_TRAVAR);
  });

  const soltar = (e) => {
    e.preventDefault();
    el.classList.remove("apertado", "carregando");
    if (eraTravado) { eraTravado = false; return destravar(b); }
    if (timer) { clearTimeout(timer); timer = null; enviar({ t: "b", b, down: false }); }
    // se travou, continua apertado até o próximo toque
  };
  el.addEventListener("pointerup", soltar);
  el.addEventListener("pointercancel", soltar);
  el.addEventListener("contextmenu", (e) => e.preventDefault());
});

// ---------- teclado ----------
// O campo funciona como espelho: a diferença entre o texto antigo e o novo vira teclas no PC.
// Isso funciona com o corretor/autocompletar do teclado do celular.
const campo = $("texto");
let anterior = "";
campo.addEventListener("input", () => {
  const novo = campo.value;
  let i = 0;
  while (i < anterior.length && i < novo.length && anterior[i] === novo[i]) i++;
  for (let n = anterior.length - i; n > 0; n--) enviar({ t: "k", v: "Backspace" });
  const add = novo.slice(i);
  if (add) enviar({ t: "txt", v: add });
  anterior = novo;
  if (novo.length > 200) { campo.value = ""; anterior = ""; }
});
campo.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    enviar({ t: "k", v: "Enter" });
    campo.value = ""; anterior = "";
  } else if (e.key === "Backspace" && !campo.value) {
    enviar({ t: "k", v: "Backspace" }); // campo vazio: apaga no PC mesmo assim
  }
});

document.querySelectorAll(".tk").forEach((el) => {
  // pointerup em vez de click: toques rápidos repetidos não são engolidos pelo bloqueio de zoom
  el.addEventListener("pointerdown", (e) => e.preventDefault()); // não tira o foco do campo
  el.addEventListener("pointerup", () => enviar({ t: "k", v: el.dataset.k }));
});

// Bloqueia zoom por toque duplo e por pinça (iOS ignora user-scalable=no)
let ultimoToque = 0;
document.addEventListener("touchend", (e) => {
  const agora = Date.now();
  if (agora - ultimoToque < 350 && e.target !== campo) e.preventDefault();
  ultimoToque = agora;
}, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault());

// ---------- início ----------
desenhar();
conectar();
atualizar();
setInterval(() => { if (!document.hidden) atualizar(); }, 3000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) soltarTravados();
  else { conectar(); atualizar(); }
});
</script>
</body>
</html>
